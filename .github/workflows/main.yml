name: Weekly Quay Image Rebuild

# Run on a schedule — weekly
env:
  QUAY_BUILD_TRIGGER_URL: ${{ secrets.QUAY_BUILD_TRIGGER_URL }}
  COMMIT_SHA: ${{ github.sha }}
  BUILD_REF: ${{ github.ref }}
on:
  schedule:
    # This cron runs every Sunday at 00:00 UTC (adjust as needed)
    - cron: '0 0 * * 0'
  workflow_dispatch: # allow manual trigger too

jobs:
  trigger-quay-build:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Quay build
        # Make a POST to the Quay build trigger webhook
        run: |
          jq -n \
            --arg commit "$COMMIT_SHA" \
            --arg ref "$BUILD_REF" \
            --arg default_branch "main" \
            '{commit: $commit, ref: $ref, default_branch: $default_branch}' \
          | curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "$QUAY_BUILD_TRIGGER_URL"
